{% extends "layouts/base.html" %} {% block content %}
<h1>PDPA Audit Reports</h1>
<div class="card card-body border-0 shadow table-wrapper table-responsive">
    {% for category, category_data in chart_data.items %}
        <h2>{{ category }}</h2>
        {% for question, question_data in category_data.items %}
            <p>{{ question }}</p>
            <canvas id="chart-{{ category|slugify }}-{{ question|slugify }}"></canvas>
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    const ctx = document.getElementById('chart-{{ category|slugify }}-{{ question|slugify }}').getContext('2d');
                    const myChart = new Chart(ctx, {
                        type: 'bar', // Or 'pie', 'line', etc.
                        data: {
                            labels: [{% for answer, count in question_data.items %}"{{ answer }}",{% endfor %}],
                            datasets: [{
                                label: 'Answer Counts',
                                data: [{% for answer, count in question_data.items %}{{ count }},{% endfor %}],
                                backgroundColor: [
                                    'rgba(255, 99, 132, 0.2)',
                                    'rgba(54, 162, 235, 0.2)',
                                    'rgba(255, 206, 86, 0.2)',
                                    'rgba(75, 192, 192, 0.2)',
                                    'rgba(153, 102, 255, 0.2)',
                                    'rgba(255, 159, 64, 0.2)'
                                ],
                                borderColor: [
                                    'rgba(255, 99, 132, 1)',
                                    'rgba(54, 162, 235, 1)',
                                    'rgba(255, 206, 86, 1)',
                                    'rgba(75, 192, 192, 1)',
                                    'rgba(153, 102, 255, 1)',
                                    'rgba(255, 159, 64, 1)'
                                ],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                });
            </script>
        {% endfor %}
    {% endfor %}
</div>

<!-- Icons from https://ionic.io/ionicons -->
<script
  type="module"
  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
></script>
<script
  nomodule
  src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
></script>

<!-- Chart.js library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


{% endblock %}
